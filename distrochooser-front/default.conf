error_log /var/log/nginx/error.log debug;  # Keep for debugging

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    location /api-repology/ {
        resolver 8.8.8.8 ipv6=off;
        proxy_pass https://repology.org/;
        proxy_ssl_server_name on;
        proxy_ssl_name repology.org;
        proxy_set_header Host repology.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent "YetnotherDistroChooser/1.0 contact: nikitzacompany@gmail.com)";
    }
}